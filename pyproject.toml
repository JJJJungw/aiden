[project]
name = "aiden"
version = "0.1.0"
description = "FastAPI authentication backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.116.0",
    "google-auth>=2.40.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.0",
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.2.1",
    "requests>=2.32.5",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "ruff>=0.5.0,<0.7.0",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
pythonpath = ["."]